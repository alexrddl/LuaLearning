<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Интерактивный курс по Lua для Roblox: 27 уроков, код запускается в браузере, задачи проверяются автоматически.">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Лунный код</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Лунный код.
   Макет: слева карта курса, справа урок колонкой в 46rem.
   Lua по-португальски значит «луна», поэтому прогресс показывает фаза луны.
   Цвет только в подсветке кода и у одной акцентной синей; всё остальное сдержанное. */
:root {
  --bg: #f1f3f9;
  --surface: #ffffff;
  --surface-2: #e8ecf5;
  --line: #d6dcea;
  --line-strong: #b9c2d8;
  --fg: #151b2d;
  --muted: #566280;
  --accent: #1d5fd8;
  --accent-ink: #ffffff;
  --accent-soft: #e3ecfc;
  --moon: #e0ae2b;
  --moon-dim: #d3daea;
  --ok: #14733a;
  --ok-bg: #dcf2e4;
  --bad: #b42334;
  --bad-bg: #fbe3e6;
  --warn: #8a5a00;
  --code-bg: #f8fafd;
  --code-fg: #1b2238;
  --sel: rgba(29, 95, 216, 0.22);
  --t-kw: #8a36cc;
  --t-str: #17784a;
  --t-num: #b04f08;
  --t-com: #66738f;
  --t-bi: #1d5fd8;
  --display: 'Unbounded', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --body: 'Golos Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0b1020;
    --surface: #121a2f;
    --surface-2: #1a2440;
    --line: #243153;
    --line-strong: #364570;
    --fg: #e6eaf6;
    --muted: #93a0c0;
    --accent: #5b9bff;
    --accent-ink: #07142e;
    --accent-soft: #172846;
    --moon: #f1d77a;
    --moon-dim: #2a3556;
    --ok: #5fd392;
    --ok-bg: #0f2e22;
    --bad: #ff8590;
    --bad-bg: #35141b;
    --warn: #e8b64c;
    --code-bg: #0a0f1d;
    --code-fg: #dce3f5;
    --sel: rgba(91, 155, 255, 0.3);
    --t-kw: #c792ea;
    --t-str: #8cd9a6;
    --t-num: #f4a261;
    --t-com: #7f8cab;
    --t-bi: #7db2ff;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0b1020;
  --surface: #121a2f;
  --surface-2: #1a2440;
  --line: #243153;
  --line-strong: #364570;
  --fg: #e6eaf6;
  --muted: #93a0c0;
  --accent: #5b9bff;
  --accent-ink: #07142e;
  --accent-soft: #172846;
  --moon: #f1d77a;
  --moon-dim: #2a3556;
  --ok: #5fd392;
  --ok-bg: #0f2e22;
  --bad: #ff8590;
  --bad-bg: #35141b;
  --warn: #e8b64c;
  --code-bg: #0a0f1d;
  --code-fg: #dce3f5;
  --sel: rgba(91, 155, 255, 0.3);
  --t-kw: #c792ea;
  --t-str: #8cd9a6;
  --t-num: #f4a261;
  --t-com: #7f8cab;
  --t-bi: #7db2ff;
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  min-height: 100%;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
h1,
h2,
h3 {
  margin: 0;
  text-wrap: balance;
}
p {
  margin: 0;
}
a {
  color: var(--accent);
}
code {
  font-family: var(--mono);
  font-size: 0.88em;
  background: var(--surface-2);
  padding: 0.1em 0.35em;
  border-radius: 4px;
  overflow-wrap: anywhere;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ───── Каркас ───── */
.app {
  display: grid;
  grid-template-columns: 17.5rem minmax(0, 1fr);
  min-height: 100vh;
}
.side {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 1.25rem 1rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.main {
  min-width: 0;
  padding-block: clamp(1.25rem, 3vw, 2.5rem) 4rem;
  padding-inline: clamp(1rem, 4vw, 3rem);
}
.topbar {
  display: none;
}

/* ───── Бренд и луна ───── */
.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
  color: var(--fg);
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  cursor: pointer;
  text-align: left;
}
.brand svg {
  flex: none;
}
.brand-name {
  font-family: var(--display);
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.1;
  display: block;
}
.brand-sub {
  font-size: 0.8rem;
  color: var(--muted);
  display: block;
}
.progress {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  font-size: 0.82rem;
  color: var(--muted);
}
.bar {
  height: 4px;
  border-radius: 2px;
  background: var(--moon-dim);
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--moon);
  transition: width 0.4s ease;
}

/* ───── Навигация ───── */
.nav {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.nav-mod h2 {
  font-family: var(--body);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.35rem;
  padding-inline: 0.5rem;
}
.nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.nav a {
  display: grid;
  grid-template-columns: 1.5rem minmax(0, 1fr);
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.5rem;
  border-radius: 8px;
  color: var(--fg);
  text-decoration: none;
  font-size: 0.92rem;
  line-height: 1.35;
}
.nav a:hover {
  background: var(--surface-2);
}
.nav a[aria-current='page'] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
.nav .num {
  width: 1.5rem;
  height: 1.5rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  border: 1px solid var(--line-strong);
}
.nav .done .num {
  background: var(--moon);
  border-color: var(--moon);
  color: #1b2238;
}

/* ───── Общее содержимое ───── */
.view {
  max-width: 46rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.view.wide {
  max-width: 62rem;
}
.eyebrow {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.45rem, 1.1rem + 1.8vw, 2.25rem);
  line-height: 1.18;
}
.lead {
  font-size: 1.1rem;
  color: var(--muted);
  max-width: 62ch;
}
.body {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.body > p,
.body > ul {
  max-width: 66ch;
}
.body h3 {
  font-size: 1.15rem;
  font-weight: 600;
  margin-top: 0.75rem;
}
.body ul {
  margin: 0;
  padding-left: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.note {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  max-width: 66ch;
  font-size: 0.95rem;
}
.note::before {
  content: 'Заметка';
  display: block;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.25rem;
}
.tbl {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
}
.tbl table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.93rem;
}
.tbl th,
.tbl td {
  text-align: left;
  padding: 0.55rem 0.85rem;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.tbl tr:last-child td {
  border-bottom: 0;
}
.tbl th {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}

/* ───── Кнопки ───── */
.btn {
  font: 600 0.92rem var(--body);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 0.5rem 1rem;
  min-height: 2.5rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  text-decoration: none;
}
.btn:hover {
  border-color: var(--accent);
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover {
  filter: brightness(1.08);
}
.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--muted);
}
.btn svg {
  flex: none;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
}
.actions .spacer {
  flex: 1;
}
.kbd {
  font-size: 0.78rem;
  color: var(--muted);
}

/* ───── Редактор кода ───── */
.ed {
  display: flex;
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  font: 13.5px/1.65 var(--mono);
  color: var(--code-fg);
}
.ed:focus-within {
  border-color: var(--accent);
}
.ed-gutter {
  margin: 0;
  flex: none;
  width: 2.6rem;
  padding: 12px 8px 12px 0;
  text-align: right;
  color: var(--t-com);
  border-right: 1px solid var(--line);
  user-select: none;
  font: inherit;
  white-space: pre;
}
.ed-gutter .err {
  color: var(--bad);
  font-weight: 600;
}
.ed-body {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
}
.ed-inner {
  position: relative;
  min-width: 100%;
  width: max-content;
}
.ed-hl,
.ed-ta {
  margin: 0;
  padding: 12px 16px;
  font: inherit;
  tab-size: 4;
  white-space: pre;
  letter-spacing: normal;
  word-spacing: normal;
  border: 0;
}
.ed-hl {
  min-height: 4.5em;
  pointer-events: none;
  color: var(--code-fg);
}
.ed-ta {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  resize: none;
  overflow: hidden;
  background: transparent;
  color: transparent;
  caret-color: var(--fg);
  outline: none;
  border-radius: 0;
  -webkit-text-fill-color: transparent;
}
.ed-ta::selection {
  background: var(--sel);
  -webkit-text-fill-color: transparent;
}
.t-k {
  color: var(--t-kw);
}
.t-s {
  color: var(--t-str);
}
.t-n {
  color: var(--t-num);
}
.t-c {
  color: var(--t-com);
  font-style: italic;
}
.t-b {
  color: var(--t-bi);
}
.ed.readonly .ed-ta {
  cursor: text;
}

/* ───── Вывод ───── */
.out {
  background: var(--surface-2);
  border-radius: 10px;
  padding: 0.7rem 1rem;
  font: 13px/1.6 var(--mono);
  max-height: 18rem;
  overflow: auto;
  color: var(--fg);
}
.out .ln {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.out .k-warn {
  color: var(--warn);
}
.out .k-err {
  color: var(--bad);
}
.out .k-hint,
.out .k-dim {
  color: var(--muted);
  font-family: var(--body);
  font-size: 0.88rem;
}
.out .k-hint {
  margin-top: 0.25rem;
}

/* ───── Пример и задание ───── */
.example {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  min-width: 0;
}
.task {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: clamp(1rem, 3vw, 1.5rem);
  display: flex;
  flex-direction: column;
  gap: 1rem;
  min-width: 0;
  margin-top: 0.75rem;
}
.task-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
}
.task-head h2 {
  font-family: var(--display);
  font-size: 1.1rem;
  font-weight: 600;
}
.pill {
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.2rem 0.6rem;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent);
}
.pill.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.task-prompt {
  max-width: 66ch;
}
.hintbox {
  background: var(--surface-2);
  border-radius: 10px;
  padding: 0.75rem 1rem;
  max-width: 66ch;
  font-size: 0.95rem;
}
.verdict {
  border-radius: 10px;
  padding: 0.75rem 1rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1rem;
}
.verdict .msg {
  flex: 1;
  min-width: 12rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.verdict.ok {
  background: var(--ok-bg);
  color: var(--ok);
}
.verdict.bad {
  background: var(--bad-bg);
  color: var(--bad);
}
.verdict strong {
  display: block;
}

/* ───── Викторина ───── */
.quiz {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.q {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem 1.1rem;
  margin: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.q legend {
  font-weight: 600;
  padding: 0;
  float: left;
  width: 100%;
  margin-bottom: 0.6rem;
}
.q legend + * {
  clear: both;
}
.opt {
  font: inherit;
  text-align: left;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 0.55rem 0.85rem;
  cursor: pointer;
}
.opt:hover:not(:disabled) {
  border-color: var(--accent);
}
.opt.ok {
  background: var(--ok-bg);
  border-color: var(--ok);
  color: var(--ok);
}
.opt.bad {
  background: var(--bad-bg);
  border-color: var(--bad);
  color: var(--bad);
}
.opt:disabled {
  cursor: default;
}
.why {
  font-size: 0.93rem;
  color: var(--muted);
}

/* ───── Пагинация ───── */
.pager {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.75rem;
  margin-top: 1rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--line);
}

/* ───── Главная ───── */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 26rem);
  gap: 2rem;
  align-items: start;
}
.hero-text {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  min-width: 0;
}
.hero-moon {
  display: flex;
  align-items: center;
  gap: 1rem;
}
.hero-moon small {
  color: var(--muted);
  font-size: 0.85rem;
  max-width: 20ch;
  line-height: 1.4;
}
.mods {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
  gap: 1rem;
}
.mod {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  min-width: 0;
}
.mod h3 {
  font-family: var(--display);
  font-size: 0.95rem;
  font-weight: 600;
}
.mod .count {
  font-size: 0.8rem;
  color: var(--muted);
}
.mod ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  font-size: 0.93rem;
}
.mod li a {
  color: var(--fg);
  text-decoration: none;
  display: flex;
  gap: 0.5rem;
}
.mod li a:hover {
  color: var(--accent);
}
.mod li.done a::after {
  content: '✓';
  color: var(--ok);
  margin-left: auto;
}
.facts {
  max-width: 66ch;
  margin: 0;
  padding-left: 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  font-size: 0.95rem;
}
.finale {
  background: var(--surface);
  border: 1px solid var(--moon);
  border-radius: 14px;
  padding: 1.25rem;
  display: flex;
  gap: 1rem;
  align-items: center;
  flex-wrap: wrap;
}
.finale > div {
  flex: 1;
  min-width: 14rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.finale h2 {
  font-family: var(--display);
  font-size: 1.1rem;
}
.alert {
  background: var(--bad-bg);
  color: var(--bad);
  border-radius: 10px;
  padding: 0.75rem 1rem;
}

/* ───── Телефон и планшет ───── */
@media (max-width: 900px) {
  .app {
    display: block;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 0.5rem 16px;
  }
  .topbar .brand-name {
    font-size: 0.95rem;
  }
  .topbar .spacer {
    flex: 1;
  }
  .side {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    bottom: 0;
    left: 0;
    height: auto;
    width: min(20rem, 88vw);
    z-index: 30;
    transform: translateX(-102%);
    transition: transform 0.2s ease;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
  }
  .side.open {
    transform: none;
  }
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 25;
    background: rgba(5, 8, 20, 0.5);
  }
  .hero {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (min-width: 901px) {
  .scrim {
    display: none;
  }
}
@media (max-width: 520px) {
  .ed {
    font-size: 12.5px;
  }
  .ed-gutter {
    width: 2.2rem;
  }
  .ed-hl,
  .ed-ta {
    padding-inline: 10px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

</style>
</head>

<div class="app">

/* Движок: Lua 5.3 (fengari) + небольшая эмуляция Roblox */
const LuaEngine = (function () {
  const F = typeof fengari !== 'undefined' ? fengari : null;

  const PRELUDE = String.raw`
local rawtostring, mtype, floor = tostring, math.type, math.floor

function tostring(v)
  if mtype(v) == "float" and v == floor(v) and v > -1e15 and v < 1e15 then
    return string.format("%d", v)
  end
  return rawtostring(v)
end

function print(...)
  local n = select("#", ...)
  local t = {}
  for i = 1, n do t[i] = tostring((select(i, ...))) end
  __emit(table.concat(t, "\t"), "log")
end

function warn(...)
  local n = select("#", ...)
  local t = {}
  for i = 1, n do t[i] = tostring((select(i, ...))) end
  __emit(table.concat(t, " "), "warn")
end

for _, k in ipairs({"execute", "exit", "remove", "rename", "getenv", "tmpname", "setlocale"}) do os[k] = nil end

function typeof(v)
  if type(v) == "table" then
    local mt = getmetatable(v)
    if mt and mt.__typeof then return mt.__typeof end
  end
  return type(v)
end

-- ===== расширения math / table / string, как в Luau
function math.clamp(x, lo, hi)
  if x < lo then return lo elseif x > hi then return hi end
  return x
end
function math.round(x)
  if x >= 0 then return floor(x + 0.5) end
  return -floor(-x + 0.5)
end
function math.sign(x)
  if x > 0 then return 1 elseif x < 0 then return -1 end
  return 0
end
function table.find(t, v, init)
  for i = init or 1, #t do if t[i] == v then return i end end
  return nil
end
function table.clear(t) for k in pairs(t) do t[k] = nil end end
function table.clone(t)
  local c = {}
  for k, v in pairs(t) do c[k] = v end
  return setmetatable(c, getmetatable(t))
end
function table.create(n, v)
  local t = {}
  for i = 1, n do t[i] = v end
  return t
end
function string.split(s, sep)
  sep = sep or ","
  local out = {}
  if sep == "" then
    for i = 1, #s do out[i] = s:sub(i, i) end
    return out
  end
  local init = 1
  while true do
    local a, b = string.find(s, sep, init, true)
    if not a then out[#out + 1] = string.sub(s, init) break end
    out[#out + 1] = string.sub(s, init, a - 1)
    init = b + 1
  end
  return out
end

-- ===== проверки для заданий
function __expect(cond, msg)
  if not cond then error("__TEST__" .. msg, 0) end
end
function __same(a, b)
  if type(a) ~= type(b) then return false end
  if type(a) ~= "table" then return a == b end
  for k, v in pairs(a) do if not __same(v, b[k]) then return false end end
  for k in pairs(b) do if a[k] == nil then return false end end
  return true
end
function __show(v)
  if type(v) == "table" then
    local t = {}
    for i, x in ipairs(v) do t[i] = __show(x) end
    return "{" .. table.concat(t, ", ") .. "}"
  end
  if type(v) == "string" then return '"' .. v .. '"' end
  return tostring(v)
end

-- ===== потоки и время (виртуальное: ждать по-настоящему не нужно)
local lastHandlerError = nil
local function resume(co, ...)
  local ok, err = coroutine.resume(co, ...)
  if not ok then
    lastHandlerError = tostring(err)
    __emit(tostring(err), "err")
  end
  return ok
end
function __noHandlerErrors()
  if lastHandlerError then
    error("__TEST__В обработчике события или в потоке произошла ошибка: " .. lastHandlerError, 0)
  end
end

local now, seq, queue = 0, 0, {}
local function schedule(co, t)
  seq = seq + 1
  queue[#queue + 1] = {t = t, co = co, seq = seq}
end
local function runDue(limit, keepTime)
  while true do
    local bi, best
    for i, e in ipairs(queue) do
      if e.t <= limit and (not best or e.t < best.t or (e.t == best.t and e.seq < best.seq)) then
        bi, best = i, e
      end
    end
    if not best then break end
    table.remove(queue, bi)
    if best.t > now then now = best.t end
    resume(best.co)
  end
  if not keepTime and limit > now then now = limit end
end
function __drain(horizon) runDue(now + (horizon or 120), true) end

task = {}
function task.wait(t)
  t = t or 0.03
  local co, ismain = coroutine.running()
  if ismain then
    if now + t > 600 then
      error("Тренажёр остановил программу: прошло больше 10 минут игрового времени. Нет ли бесконечного цикла?", 2)
    end
    runDue(now + t)
  else
    schedule(co, now + t)
    coroutine.yield()
  end
  return t
end
function task.spawn(f, ...)
  if type(f) ~= "function" then error("task.spawn ожидает функцию", 2) end
  local co = coroutine.create(f)
  resume(co, ...)
  return co
end
function task.defer(f, ...)
  local args = table.pack(...)
  local co = coroutine.create(function() f(table.unpack(args, 1, args.n)) end)
  schedule(co, now)
  return co
end
function task.delay(t, f, ...)
  local args = table.pack(...)
  local co = coroutine.create(function() f(table.unpack(args, 1, args.n)) end)
  schedule(co, now + (t or 0))
  return co
end
wait = task.wait
function time() return now end
function tick() return now end

-- ===== Vector3, Color3, Enum
local V3 = {__typeof = "Vector3"}
Vector3 = {}
function Vector3.new(x, y, z) return setmetatable({X = x or 0, Y = y or 0, Z = z or 0}, V3) end
Vector3.zero = Vector3.new(0, 0, 0)
Vector3.one = Vector3.new(1, 1, 1)
V3.__index = function(t, k)
  if k == "Magnitude" then return math.sqrt(t.X * t.X + t.Y * t.Y + t.Z * t.Z) end
  return nil
end
V3.__add = function(a, b) return Vector3.new(a.X + b.X, a.Y + b.Y, a.Z + b.Z) end
V3.__sub = function(a, b) return Vector3.new(a.X - b.X, a.Y - b.Y, a.Z - b.Z) end
V3.__mul = function(a, b)
  if type(a) == "number" then return Vector3.new(b.X * a, b.Y * a, b.Z * a) end
  if type(b) == "number" then return Vector3.new(a.X * b, a.Y * b, a.Z * b) end
  return Vector3.new(a.X * b.X, a.Y * b.Y, a.Z * b.Z)
end
V3.__div = function(a, b)
  if type(b) == "number" then return Vector3.new(a.X / b, a.Y / b, a.Z / b) end
  return Vector3.new(a.X / b.X, a.Y / b.Y, a.Z / b.Z)
end
V3.__unm = function(a) return Vector3.new(-a.X, -a.Y, -a.Z) end
V3.__eq = function(a, b) return a.X == b.X and a.Y == b.Y and a.Z == b.Z end
V3.__tostring = function(v) return tostring(v.X) .. ", " .. tostring(v.Y) .. ", " .. tostring(v.Z) end

local C3 = {__typeof = "Color3"}
C3.__index = C3
Color3 = {}
function Color3.new(r, g, b) return setmetatable({R = r or 0, G = g or 0, B = b or 0}, C3) end
function Color3.fromRGB(r, g, b) return Color3.new((r or 0) / 255, (g or 0) / 255, (b or 0) / 255) end
C3.__eq = function(a, b) return a.R == b.R and a.G == b.G and a.B == b.B end
C3.__tostring = function(c) return tostring(c.R) .. ", " .. tostring(c.G) .. ", " .. tostring(c.B) end

local BC = {__typeof = "BrickColor"}
BC.__index = BC
BC.__tostring = function(b) return b.Name end
BrickColor = {}
function BrickColor.new(name) return setmetatable({Name = name}, BC) end

Enum = setmetatable({}, {__index = function(t, k)
  local sub = setmetatable({}, {__index = function(_, v) return "Enum." .. k .. "." .. v end})
  rawset(t, k, sub)
  return sub
end})

-- ===== События
local Signal = {}
Signal.__index = Signal
function Signal.new() return setmetatable({handlers = {}}, Signal) end
function Signal:Connect(fn)
  if type(fn) ~= "function" then error("Connect ожидает функцию", 2) end
  local sig = self
  local conn = {Connected = true}
  function conn:Disconnect()
    self.Connected = false
    for i, h in ipairs(sig.handlers) do
      if h.conn == self then table.remove(sig.handlers, i) break end
    end
  end
  table.insert(self.handlers, {fn = fn, conn = conn})
  return conn
end
function Signal:Once(fn)
  local conn
  conn = self:Connect(function(...)
    conn:Disconnect()
    fn(...)
  end)
  return conn
end
function Signal:Fire(...)
  local list = {}
  for i, h in ipairs(self.handlers) do list[i] = h end
  for _, h in ipairs(list) do
    if h.conn.Connected then
      resume(coroutine.create(h.fn), ...)
    end
  end
end
function Signal:Clear()
  for _, h in ipairs(self.handlers) do h.conn.Connected = false end
  self.handlers = {}
end

-- ===== Instance
local D = setmetatable({}, {__mode = "k"})
local IM = {__typeof = "Instance"}
local generic = {}
local CLASS = {}
local classNames = {}

local function sigset(...)
  local t = {}
  for _, n in ipairs({...}) do t[n] = true end
  return t
end
local function defClass(name, def)
  def.signals = def.signals or {}
  def.nilprops = def.nilprops or {}
  CLASS[name] = def
  classNames[#classNames + 1] = name
end

local function signalFor(d, name)
  local s = d.signals[name]
  if not s then
    s = Signal.new()
    d.signals[name] = s
  end
  return s
end

local function invalid(d, k, level)
  error(tostring(k) .. " is not a valid member of " .. d.props.ClassName .. " (в тренажёре поддерживаются не все свойства Roblox)", level)
end

IM.__index = function(self, k)
  local d = D[self]
  local v = d.props[k]
  if v ~= nil then return v end
  local gm = generic[k]
  if gm then return gm end
  local cm = d.def.methods and d.def.methods[k]
  if cm then return cm end
  if d.def.signals[k] or k == "ChildAdded" or k == "ChildRemoved" or k == "Destroying" then
    return signalFor(d, k)
  end
  for _, c in ipairs(d.children) do
    if D[c].props.Name == k then return c end
  end
  if k == "Parent" or d.def.nilprops[k] then return nil end
  invalid(d, k, 3)
end

local function setParent(self, newParent)
  local d = D[self]
  if d.destroyed then
    error("The Parent property of " .. tostring(d.props.Name) .. " is locked because it has been destroyed", 3)
  end
  if newParent ~= nil and not D[newParent] then
    error("Parent должен быть объектом Instance или nil", 3)
  end
  local old = d.props.Parent
  if old == newParent then return end
  if newParent ~= nil then
    local p = newParent
    while p do
      if p == self then error("Нельзя сделать объект потомком самого себя", 3) end
      p = D[p].props.Parent
    end
  end
  if old then
    local oc = D[old].children
    for i, c in ipairs(oc) do
      if c == self then table.remove(oc, i) break end
    end
    local s = D[old].signals.ChildRemoved
    if s then s:Fire(self) end
  end
  d.props.Parent = newParent
  if newParent then
    local nd = D[newParent]
    table.insert(nd.children, self)
    local s = nd.signals.ChildAdded
    if s then s:Fire(self) end
    if nd.props.ClassName == "Players" and d.props.ClassName == "Player" then
      local pa = nd.signals.PlayerAdded
      if pa then pa:Fire(self) end
    end
  end
end

IM.__newindex = function(self, k, v)
  local d = D[self]
  if k == "Parent" then
    setParent(self, v)
    return
  end
  if d.props[k] == nil and not d.def.nilprops[k] then invalid(d, k, 3) end
  local old = d.props[k]
  local hook = d.def.onset
  if hook then v = hook(self, d, k, v) end
  d.props[k] = v
  if d.def.valueClass and k == "Value" and old ~= v then
    local s = d.signals.Changed
    if s then s:Fire(v) end
  end
end
IM.__tostring = function(self) return tostring(D[self].props.Name) end

generic.Destroy = function(self)
  local d = D[self]
  if d.destroyed then return end
  local kids = {}
  for i, c in ipairs(d.children) do kids[i] = c end
  for _, c in ipairs(kids) do c:Destroy() end
  local ds = d.signals.Destroying
  if ds then ds:Fire() end
  if d.props.Parent then setParent(self, nil) end
  d.destroyed = true
  for _, s in pairs(d.signals) do s:Clear() end
end
generic.ClearAllChildren = function(self)
  local kids = {}
  for i, c in ipairs(D[self].children) do kids[i] = c end
  for _, c in ipairs(kids) do c:Destroy() end
end
generic.GetChildren = function(self)
  local out = {}
  for i, c in ipairs(D[self].children) do out[i] = c end
  return out
end
generic.GetDescendants = function(self)
  local out = {}
  local function walk(inst)
    for _, c in ipairs(D[inst].children) do
      out[#out + 1] = c
      walk(c)
    end
  end
  walk(self)
  return out
end
generic.FindFirstChild = function(self, name, recursive)
  local d = D[self]
  for _, c in ipairs(d.children) do
    if D[c].props.Name == name then return c end
  end
  if recursive then
    for _, c in ipairs(d.children) do
      local r = c:FindFirstChild(name, true)
      if r then return r end
    end
  end
  return nil
end
generic.WaitForChild = function(self, name)
  local c = self:FindFirstChild(name)
  if not c then
    error("WaitForChild: объект '" .. tostring(name) .. "' не найден. В Studio функция ждала бы его появления, тренажёр сразу сообщает об ошибке.", 2)
  end
  return c
end
generic.FindFirstChildOfClass = function(self, cls)
  for _, c in ipairs(D[self].children) do
    if D[c].props.ClassName == cls then return c end
  end
  return nil
end
generic.IsA = function(self, cls)
  local d = D[self]
  if cls == "Instance" or cls == d.props.ClassName then return true end
  return (d.def.isA and d.def.isA[cls]) or false
end
generic.IsDescendantOf = function(self, ancestor)
  local p = D[self].props.Parent
  while p do
    if p == ancestor then return true end
    p = D[p].props.Parent
  end
  return false
end
generic.GetFullName = function(self)
  local parts = {}
  local cur = self
  while cur do
    local d = D[cur]
    if d.props.ClassName == "DataModel" then break end
    table.insert(parts, 1, tostring(d.props.Name))
    cur = d.props.Parent
  end
  return table.concat(parts, ".")
end
generic.SetAttribute = function(self, k, v) D[self].attrs[k] = v end
generic.GetAttribute = function(self, k) return D[self].attrs[k] end
generic.Clone = function(self)
  local d = D[self]
  local c = Instance.new(d.props.ClassName)
  for k, v in pairs(d.props) do
    if k ~= "Parent" and k ~= "ClassName" and k ~= "Character" then c[k] = v end
  end
  for _, ch in ipairs(d.children) do
    local cc = ch:Clone()
    cc.Parent = c
  end
  return c
end

Instance = {}
function Instance.new(className, parent)
  local def = CLASS[className]
  if not def then
    error("Неизвестный класс '" .. tostring(className) .. "'. В тренажёре доступны: " .. table.concat(classNames, ", "), 2)
  end
  local props = def.props and def.props() or {}
  props.ClassName = className
  props.Name = className
  local self = setmetatable({}, IM)
  D[self] = {props = props, def = def, children = {}, signals = {}, attrs = {}, destroyed = false}
  if parent then setParent(self, parent) end
  return self
end

defClass("Part", {
  props = function()
    return {
      Position = Vector3.new(0, 0, 0), Size = Vector3.new(4, 1, 2), Orientation = Vector3.new(0, 0, 0),
      Anchored = false, CanCollide = true, Transparency = 0,

defClass("Model", {nilprops = sigset("PrimaryPart"), isA = {PVInstance = true}})
defClass("Folder", {})
defClass("Humanoid", {
  props = function() return {Health = 100, MaxHealth = 100, WalkSpeed = 16, JumpPower = 50} end,
  signals = sigset("Died", "HealthChanged"),
  methods = {TakeDamage = function(self, n) self.Health = self.Health - n end},
  onset = function(self, d, k, v)
    if k == "Health" then
      if v > d.props.MaxHealth then v = d.props.MaxHealth end
      if v < 0 then v = 0 end
      local old = d.props.Health
      d.props.Health = v
      local hc = d.signals.HealthChanged
      if hc and old ~= v then hc:Fire(v) end
      if v <= 0 and old > 0 then
        local died = d.signals.Died
        if died then died:Fire() end
      end
    end
    return v
  end,
})
for name, default in pairs({IntValue = 0, NumberValue = 0, StringValue = "", BoolValue = false}) do
  defClass(name, {
    props = function() return {Value = default} end,
    signals = sigset("Changed"),
    valueClass = true,
    isA = {ValueBase = true},

defClass("Player", {props = function() return {UserId = 1} end, nilprops = sigset("Character")})
defClass("Players", {

`;

  // Поддержка += -= *= /= //= %= ^= ..= из Luau (только как отдельная строка-инструкция)
  function stripComment(s) {
    let q = null;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) {
        if (c === '\\') i++;
        else if (c === q) q = null;
      } else if (c === '"' || c === "'") q = c;
      else if (c === '-' && s[i + 1] === '-') return s.slice(0, i);
    }
    return s;
  }
  const COMPOUND = /^(\s*)([A-Za-z_]\w*(?:(?:\.[A-Za-z_]\w*)|(?:\[[^\]\n]+\]))*)\s*(\+|-|\*|\/\/|\/|%|\^|\.\.)=\s*(.+)$/;
  function preprocess(code) {
    return code
      .split('\n')
      .map((line) => {
        if (/^\s*--/.test(line)) return line;
        const m = COMPOUND.exec(line);
        if (!m) return line;
        const rhs = stripComment(m[4]).trim();
        if (!rhs) return line;
        return `${m[1]}${m[2]} = ${m[2]} ${m[3]} (${rhs})`;
      })
      .join('\n');
  }

  const HINTS = [
    [/attempt to call a nil value \((?:global|local|field|method) '([^']+)'\)/, (m) => `Вы вызываете «${m[1]}», но такой функции нет (значение nil). Проверьте название и регистр букв.`],
    [/attempt to index a nil value \((?:global|local|field|upvalue) '([^']+)'\)/, (m) => `Переменная «${m[1]}» равна nil, поэтому обратиться к её полям нельзя.`],
    [/attempt to perform arithmetic on a nil value(?: \((?:global|local|field|upvalue) '([^']+)'\))?/, (m) => `В вычислении участвует nil${m[1] ? ` (переменная «${m[1]}»)` : ''}. Ему не присвоили значение.`],

    [/attempt to concatenate a nil value(?: \((?:global|local|field|upvalue) '([^']+)'\))?/, (m) => `Склеивать с «..» можно строки и числа, а здесь nil${m[1] ? ` (переменная «${m[1]}»)` : ''}.`],
    [/attempt to compare (\w+) with (\w+)/, (m) => `Сравнивать можно значения одного типа, а здесь ${m[1]} и ${m[2]}.`],
    [/'end' expected/, () => 'Не хватает end. Каждому if, for, while и function нужен свой end.'],
    [/'then' expected/, () => 'После условия в if и elseif нужно слово then.'],
    [/'do' expected/, () => 'После условия в while и после диапазона в for нужно слово do.'],
    [/unexpected symbol near/, () => 'Lua не понимает этот символ. Проверьте кавычки, скобки и запятые рядом.'],
  ];

  function explain(msg) {
    for (const [re, fn] of HINTS) {
      const m = re.exec(msg);
      if (m) return fn(m);
    }
    return null;
  }

  function parseError(raw, userLines) {
    let msg = raw == null ? 'неизвестная ошибка' : raw;
    if (msg.includes('Программа выполняется слишком долго')) {
      return { line: null, msg: 'Программа выполняется слишком долго. Похоже, в коде бесконечный цикл.', hint: 'Проверьте, меняется ли в цикле while или repeat то, от чего зависит условие выхода.', test: false };
    }
    const m = /^main:(\d+): ([\s\S]*)$/.exec(msg);
    let line = null;
    let body = msg;
    if (m) {
      line = parseInt(m[1], 10);
      body = m[2];
    }
    const inTest = line != null && line > userLines;
    return { line: inTest ? null : line, msg: body, hint: explain(body), test: inTest };
  }

  function exec(L, src, name) {
    const { lua, lauxlib, to_luastring, to_jsstring } = F;
    const buf = to_luastring(src);
    let st = lauxlib.luaL_loadbuffer(L, buf, buf.length, to_luastring(name));
    if (st !== lua.LUA_OK) {
      const p = lua.lua_tostring(L, -1);
      const m = p ? to_jsstring(p) : 'ошибка загрузки';
      lua.lua_pop(L, 1);
      return { ok: false, phase: 'load', msg: m };
    }
    st = lua.lua_pcall(L, 0, 0, 0);
    if (st !== lua.LUA_OK) {
      const p = lua.lua_tostring(L, -1);
      const m = p ? to_jsstring(p) : '(ошибка без текста)';
      lua.lua_pop(L, 1);
      return { ok: false, phase: 'run', msg: m };
    }
    return { ok: true };
  }

  function makeState(out, timeoutMs) {
    const { lua, lauxlib, lualib, to_luastring, to_jsstring } = F;
    const L = lauxlib.luaL_newstate();
    lualib.luaL_openlibs(L);
    for (const n of ['io', 'package', 'require', 'dofile', 'loadfile', 'debug']) {
      lua.lua_pushnil(L);
      lua.lua_setglobal(L, to_luastring(n));
    }
    lua.lua_pushcfunction(L, function (L) {
      const kind = lua.lua_gettop(L) >= 2 ? to_jsstring(lua.lua_tostring(L, 2)) : 'log';
      if (out.length >= 400) {
        return lauxlib.luaL_error(L, to_luastring('Слишком много строк вывода. Программа остановлена.'));
      }
      const p = lua.lua_tostring(L, 1);
      out.push({ k: kind, t: p ? to_jsstring(p) : '' });
      return 0;
    });
    lua.lua_setglobal(L, to_luastring('__emit'));
    const r = exec(L, PRELUDE, '=prelude');
    if (!r.ok) throw new Error('prelude: ' + r.msg);
    const deadline = (typeof performance !== 'undefined' ? performance.now() : Date.now()) + timeoutMs;
    const nowFn = typeof performance !== 'undefined' ? () => performance.now() : () => Date.now();
    lua.lua_sethook(
      L,
      function (L) {
        if (nowFn() > deadline) {
          lauxlib.luaL_error(L, to_luastring('Программа выполняется слишком долго'));
        }
      },
      lua.LUA_MASKCOUNT,
      20000
    );
    return L;
  }

  /**
   * run(code, {test, expectOut, minOut})
   * status: 'ok' (просто запуск) | 'pass' | 'fail' | 'error' | 'syntax'
   */
  function run(userCode, opts) {
    opts = opts || {};
    const out = [];
    if (!F) {
      return { status: 'error', out, error: { line: null, msg: 'Интерпретатор Lua не загрузился. Проверьте подключение к интернету и обновите страницу.', hint: null }, failMsg: null };
    }
    const pre = preprocess(userCode);
    const userLines = pre.split('\n').length;
    let L;
    try {
      L = makeState(out, opts.timeout || 2500);
    } catch (e) {
      return { status: 'error', out, error: { line: null, msg: String(e.message || e), hint: null }, failMsg: null };
    }
    const { lua, lauxlib, to_luastring } = F;
    try {
      // 1. Синтаксис пользовательского кода отдельно, чтобы ошибки указывали на его строки
      const buf = to_luastring(pre);
      const st = lauxlib.luaL_loadbuffer(L, buf, buf.length, to_luastring('=main'));
      if (st !== lua.LUA_OK) {
        const p = lua.lua_tostring(L, -1);
        const raw = p ? F.to_jsstring(p) : 'синтаксическая ошибка';
        return { status: 'syntax', out, error: parseError(raw, userLines), failMsg: null };
      }
      lua.lua_pop(L, 1);

      const checking = opts.test != null;
      const src = checking ? pre + '\n' + opts.test + '\n' : pre;
      let r = exec(L, src, '=main');
      if (r.ok && !checking) r = exec(L, '__drain()', '=prelude');
      if (!r.ok) {
        const m = /__TEST__([\s\S]*)$/.exec(r.msg);
        if (m) return { status: 'fail', out, error: null, failMsg: m[1] };
        const err = parseError(r.msg, userLines);
        if (err.test) {
          return {
            status: 'fail',
            out,
            error: null,
            failMsg: 'Проверка не смогла выполниться: ' + err.msg + '. Убедитесь, что функции и переменные называются так, как в задании.',
          };
        }
        return { status: 'error', out, error: err, failMsg: null };
      }
      if (checking) {
        const printed = out.filter((o) => o.k === 'log').map((o) => o.t);
        if (opts.expectOut) {
          const exp = opts.expectOut;
          const same = printed.length === exp.length && printed.every((s, i) => s.trim() === exp[i]);
          if (!same) {
            return {
              status: 'fail',
              out,
              error: null,
              failMsg: 'Вывод не совпал с ожидаемым.\nОжидалось:\n' + exp.join('\n') + '\n\nПолучилось:\n' + (printed.join('\n') || '(ничего не выведено)'),
            };
          }
        }
        if (opts.minOut && printed.length < opts.minOut) {
          return { status: 'fail', out, error: null, failMsg: `Нужно вывести хотя бы ${opts.minOut} строки через print, сейчас выведено ${printed.length}.` };
        }
        return { status: 'pass', out, error: null, failMsg: null };
      }
      return { status: 'ok', out, error: null, failMsg: null };
    } catch (e) {
      return { status: 'error', out, error: { line: null, msg: 'Внутренняя ошибка тренажёра: ' + (e && e.message ? e.message : e), hint: null }, failMsg: null };
    }
  }

  return { run, preprocess, available: !!F };
})();

const tabify = (s) => s.replace(/^(?: {4})+/gm, (m) => '\t'.repeat(m.length / 4));

  const lines = s.split('\n');
  const pad = Math.min(...lines.filter((x) => x.trim()).map((x) => /^ */.exec(x)[0].length));
  return lines.map((x) => x.slice(Math.min(pad, /^ */.exec(x)[0].length))).join('\n');
};

      test: L`

        expect(alex.leaderstats.Coins.Value == 1, "После касания игрока в Coins должно быть 1, а сейчас " .. __show(alex.leaderstats.Coins.Value))
        expect(coin.Parent == nil, "После касания монета должна быть удалена (Destroy)")

        expect(alex.leaderstats.Coins.Value == 1, "Одна монета не должна давать очко дважды")
        __noHandlerErrors()
      `,
      hint: 'После создания монеты подключите coin.Touched:Connect(function(hit) ... end). Внутри: local player = Players:GetPlayerFromCharacter(hit.Parent). Если player есть, прибавьте 1 к player.leaderstats.Coins.Value и вызовите coin:Destroy(). В конце функции не забудьте return coin.',
      solution: L`

      `,

  /* ───────────── 27 ───────────── */
  {

      { code: L`local hazard = Instance.new("Part")

__expect(h.Parent == workspace, "Объект должен быть в workspace")`, hint: 'Создайте Part через Instance.new, задайте Name = "Hazard", Anchored = true, Parent = workspace, затем return hazard.', solution: L`local function makeHazard()

<script>
/* Интерфейс курса */
(function () {
  const store = {
    get(k) {
      try { return localStorage.getItem(k); } catch (e) { return null; }
    },
    set(k, v) {
      try { localStorage.setItem(k, v); } catch (e) { /* хранилище недоступно */ }
    },
    del(k) {
      try { localStorage.removeItem(k); } catch (e) { /* хранилище недоступно */ }
    },
  };
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const $ = (sel, root) => (root || document).querySelector(sel);

  let doneList = [];
  try { doneList = JSON.parse(store.get('lc.done') || '[]'); } catch (e) { doneList = []; }
  const done = new Set(doneList.filter((id) => LESSONS.some((l) => l.id === id)));
  const total = LESSONS.length;
  const byId = (id) => LESSONS.find((l) => l.id === id);
  const indexOf = (id) => LESSONS.findIndex((l) => l.id === id);
  let currentId = 'home';

  /* ───── Подсветка Lua ───── */
  const KW = new Set('and break do else elseif end false for function goto if in local nil not or repeat return then true until while'.split(' '));
  const BUILTIN = new Set('print warn type typeof tostring tonumber pairs ipairs next select pcall error assert setmetatable getmetatable math string table task game workspace script Instance Vector3 Color3 BrickColor Enum time tick wait'.split(' '));
  const TOKEN = /--\[(=*)\[[\s\S]*?\]\1\]|--[^\n]*|\[(=*)\[[\s\S]*?\]\2\]|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?|\b0[xX][0-9a-fA-F]+\b|\b\d+\.?\d*(?:[eE][+-]?\d+)?\b|[A-Za-z_]\w*/g;
  function highlight(src) {
    let out = '';
    let last = 0;
    let m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src))) {
      out += esc(src.slice(last, m.index));
      last = m.index + m[0].length;
      const t = m[0];
      let cls = '';
      if (t.startsWith('--')) cls = 'c';
      else if (t[0] === '"' || t[0] === "'" || t[0] === '[') cls = 's';
      else if (/^\d/.test(t)) cls = 'n';
      else if (KW.has(t)) cls = 'k';
      else if (BUILTIN.has(t)) cls = 'b';
      out += cls ? `<span class="t-${cls}">${esc(t)}</span>` : esc(t);
    }
    return out + esc(src.slice(last));
  }

  /* ───── Луна ───── */
  function moonSVG(f, size, label) {
    let lit = '';
    if (f >= 1) lit = '<circle cx="24" cy="24" r="20" fill="var(--moon)"/>';
    else if (f > 0) {
      const rx = (20 * Math.abs(1 - 2 * f)).toFixed(2);
      lit = `<path d="M24 4A20 20 0 0 1 24 44A${rx} 20 0 0 ${f < 0.5 ? 0 : 1} 24 4Z" fill="var(--moon)"/>`;
    }
    return `<svg viewBox="0 0 48 48" width="${size}" height="${size}" role="img" aria-label="${esc(label)}"><circle cx="24" cy="24" r="20" fill="var(--moon-dim)"/>${lit}<circle cx="24" cy="24" r="20" fill="none" stroke="var(--line-strong)" stroke-width="1.5"/></svg>`;
  }
  const PLAY = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>';

  /* ───── Редактор ───── */
  function createEditor(code, opts) {
    opts = opts || {};
    const root = document.createElement('div');
    root.className = 'ed' + (opts.readOnly ? ' readonly' : '');
    root.innerHTML =
      '<pre class="ed-gutter" aria-hidden="true"></pre>' +
      '<div class="ed-body"><div class="ed-inner"><pre class="ed-hl" aria-hidden="true"></pre>' +
      `<textarea class="ed-ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="${esc(opts.label || 'Код на Lua')}"></textarea>` +
      '</div></div>';
    const gut = $('.ed-gutter', root);
    const hl = $('.ed-hl', root);
    const ta = $('.ed-ta', root);
    ta.readOnly = !!opts.readOnly;
    ta.value = code;
    let errLine = null;
    let trap = true;

    function paint() {
      const v = ta.value;
      hl.innerHTML = highlight(v) + (v.endsWith('\n') ? ' ' : '');
      const n = v.split('\n').length;
      let g = '';
      for (let i = 1; i <= n; i++) g += (i > 1 ? '\n' : '') + (i === errLine ? `<span class="err">${i}</span>` : i);
      gut.innerHTML = g;
    }
    function insert(text) {
      ta.focus();
      let ok = false;
      try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
      if (!ok) {
        ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
        ta.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
    function shiftLines(outdent) {
      const v = ta.value;
      const s = ta.selectionStart;
      const e = ta.selectionEnd;
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      let le = v.indexOf('\n', e);
      if (le === -1) le = v.length;
      const block = v.slice(ls, le).split('\n');
      const changed = block.map((line) => (outdent ? line.replace(/^(\t| {1,4})/, '') : '\t' + line));
      const text = changed.join('\n');
      ta.setSelectionRange(ls, le);
      ta.setRangeText(text, ls, le, 'select');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }

    ta.addEventListener('input', () => {
      errLine = null;
      paint();
      if (opts.onInput) opts.onInput(ta.value);
    });
    ta.addEventListener('blur', () => { trap = true; });
    ta.addEventListener('keydown', (e) => {
      if (opts.readOnly) return;
      if (e.key === 'Escape') { trap = false; return; }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (opts.onRun) opts.onRun();
        return;
      }
      if (e.key === 'Tab' && trap) {
        e.preventDefault();
        const multi = ta.value.slice(ta.selectionStart, ta.selectionEnd).includes('\n');
        if (multi || e.shiftKey) shiftLines(e.shiftKey);
        else insert('\t');
        return;
      }
      if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const v = ta.value;
        const s = ta.selectionStart;
        const ls = v.lastIndexOf('\n', s - 1) + 1;
        const line = v.slice(ls, s);
        const indent = /^[ \t]*/.exec(line)[0];
        const bare = line.replace(/--.*$/, '');
        const extra = /(\bthen|\bdo|\belse|\brepeat|\bfunction\b.*\)|\{)\s*$/.test(bare) ? '\t' : '';
        e.preventDefault();
        insert('\n' + indent + extra);
      }
    });
    paint();
    return {
      el: root,
      get: () => ta.value,
      set(v) { ta.value = v; errLine = null; paint(); },
      markError(n) { errLine = n; paint(); },
      focus: () => ta.focus(),
    };
  }

  /* ───── Вывод ───── */
  function renderOut(el, res) {
    el.hidden = false;
    let html = '';
    for (const o of res.out) {
      let t = o.t;
      if (o.k === 'err') t = t.replace(/^main:(\d+): /, 'Строка $1: ');
      html += `<div class="ln k-${o.k}">${t ? esc(t) : '&nbsp;'}</div>`;
    }
    if (res.error) {
      const e = res.error;
      html += `<div class="ln k-err">${e.line ? `Строка ${e.line}: ` : ''}${esc(e.msg)}</div>`;
      if (e.hint) html += `<div class="ln k-hint">${esc(e.hint)}</div>`;
    }
    if (!html) html = '<div class="ln k-dim">Программа ничего не вывела.</div>';
    el.innerHTML = html;
  }
  function newOut() {
    const out = document.createElement('div');
    out.className = 'out';
    out.setAttribute('role', 'log');
    out.setAttribute('aria-live', 'polite');
    out.hidden = true;
    return out;
  }
  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function button(label, cls, onClick) {
    const b = el('button', 'btn ' + (cls || ''), label);
    b.type = 'button';
    b.addEventListener('click', onClick);
    return b;
  }

  /* ───── Блоки урока ───── */
  function exampleBlock(code) {
    const wrap = el('div', 'example');
    const out = newOut();
    const ed = createEditor(code, { label: 'Пример кода, его можно менять', onRun: run });
    function run() {
      const res = LuaEngine.run(ed.get());
      renderOut(out, res);
      ed.markError(res.error && res.error.line ? res.error.line : null);
    }
    const actions = el('div', 'actions');
    actions.append(
      button(PLAY + ' Запустить', 'btn-primary', run),
      button('Сбросить', 'btn-ghost', () => { ed.set(code); out.hidden = true; })
    );
    actions.append(el('span', 'spacer'), el('span', 'kbd', 'Ctrl + Enter'));
    wrap.append(ed.el, actions, out);
    return wrap;
  }
  function staticCode(code) {
    return createEditor(code, { readOnly: true, label: 'Пример кода' }).el;
  }
  function renderBlock(b) {
    if (b.p) return el('p', null, b.p);
    if (b.h) return el('h3', null, b.h);
    if (b.note) return el('div', 'note', b.note);
    if (b.list) return el('ul', null, b.list.map((i) => `<li>${i}</li>`).join(''));
    if (b.table) {
      const t = b.table;
      const html =
        '<table><thead><tr>' + t.head.map((h) => `<th>${h}</th>`).join('') + '</tr></thead><tbody>' +
        t.rows.map((r) => '<tr>' + r.map((c) => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
      return el('div', 'tbl', html);
    }
    if (b.code) return b.run ? exampleBlock(b.code) : staticCode(b.code);
    return el('div');
  }

  /* ───── Задание ───── */
  function taskBlock(l) {
    const t = l.task;
    const sec = el('section', 'task');
    const head = el('div', 'task-head');
    const pill = el('span', 'pill', 'Задание');
    const h = el('h2', null, 'Попробуйте сами');
    head.append(pill, h);
    sec.append(head, el('div', 'task-prompt', t.prompt));

    const saved = store.get('lc.code.' + l.id);
    let timer = null;
    const ed = createEditor(saved != null ? saved : t.starter, {
      label: 'Редактор задания',
      onRun: run,
      onInput(v) {
        clearTimeout(timer);
        timer = setTimeout(() => store.set('lc.code.' + l.id, v), 300);
      },
    });
    const out = newOut();
    const verdict = el('div', 'verdict');
    verdict.hidden = true;
    verdict.setAttribute('role', 'status');
    const hint = el('div', 'hintbox', '<b>Подсказка.</b> ' + esc(t.hint));
    hint.hidden = true;
    const solBox = el('div', 'example');
    solBox.hidden = true;

    function setPill() {
      pill.textContent = done.has(l.id) ? 'Выполнено' : 'Задание';
      pill.className = 'pill' + (done.has(l.id) ? ' ok' : '');
    }
    function run() {
      const res = LuaEngine.run(ed.get());
      renderOut(out, res);
      ed.markError(res.error && res.error.line ? res.error.line : null);
      verdict.hidden = true;
    }
    function check() {
      const res = LuaEngine.run(ed.get(), { test: t.test, expectOut: t.expectOut, minOut: t.minOut });
      renderOut(out, res);
      ed.markError(res.error && res.error.line ? res.error.line : null);
      verdict.hidden = false;
      verdict.innerHTML = '';
      if (res.status === 'pass') {
        verdict.className = 'verdict ok';
        verdict.innerHTML = '<div class="msg"><strong>Верно!</strong>Все проверки пройдены.</div>';
        markDone(l.id);
        setPill();
        const next = LESSONS[indexOf(l.id) + 1];
        if (next) verdict.append(button('Следующий урок', 'btn-primary', () => go(next.id)));
        if (l.finale) showFinale(sec);
      } else if (res.status === 'fail') {
        verdict.className = 'verdict bad';
        verdict.innerHTML = `<div class="msg"><strong>Пока не то.</strong>${esc(res.failMsg)}</div>`;
      } else {
        verdict.className = 'verdict bad';
        verdict.innerHTML = '<div class="msg"><strong>Код не выполнился.</strong>Исправьте ошибку из окна вывода и проверьте снова.</div>';
      }
    }

    let solArmed = false;
    let solTimer = null;
    const solBtn = button('Показать решение', 'btn-ghost', () => {
      if (!solArmed && solBox.hidden) {
        solArmed = true;
        solBtn.textContent = 'Точно показать решение?';
        clearTimeout(solTimer);
        solTimer = setTimeout(() => { solArmed = false; solBtn.textContent = 'Показать решение'; }, 4000);
        return;
      }
      solArmed = false;
      if (!solBox.hidden) {
        solBox.hidden = true;
        solBtn.textContent = 'Показать решение';
        return;
      }
      solBox.hidden = false;
      solBox.innerHTML = '';
      solBox.append(staticCode(t.solution));
      const use = el('div', 'actions');
      use.append(button('Подставить в редактор', '', () => { ed.set(t.solution); store.set('lc.code.' + l.id, t.solution); }));
      solBox.append(use);
      solBtn.textContent = 'Скрыть решение';
    });
    const hintBtn = button('Подсказка', 'btn-ghost', () => {
      hint.hidden = !hint.hidden;
    });

    const actions = el('div', 'actions');
    actions.append(
      button(PLAY + ' Запустить', '', run),
      button('Проверить', 'btn-primary', check),
      button('Сбросить', 'btn-ghost', () => {
        ed.set(t.starter);
        store.del('lc.code.' + l.id);
        out.hidden = true;
        verdict.hidden = true;
      }),
      el('span', 'spacer'),
      hintBtn,
      solBtn
    );
    setPill();
    sec.append(ed.el, actions, hint, verdict, out, solBox);
    return sec;
  }

  function showFinale(after) {
    if ($('.finale')) return;
    const box = el('div', 'finale');
    box.innerHTML =
      moonSVG(1, 64, 'Полная луна') +
      '<div><h2>Курс пройден</h2><p>Вы прошли путь от первой строки print до работающей механики с событиями, игроками и таблицей лидеров. Дальше стоит открыть Roblox Studio и собрать то же самое уже в настоящей игре.</p>' +
      '<div class="actions"><a class="btn btn-primary" href="https://create.roblox.com/docs" target="_blank" rel="noopener">Документация Roblox</a>' +
      '<a class="btn" href="https://luau.org/" target="_blank" rel="noopener">Язык Luau</a></div></div>';
    after.after(box);
  }

  /* ───── Викторина ───── */
  function quizBlock(l) {
    const wrap = el('section', 'quiz');
    const state = l.quiz.map(() => false);
    const result = el('div', 'verdict ok');
    result.hidden = true;
    result.setAttribute('role', 'status');
    l.quiz.forEach((q, qi) => {
      const f = el('fieldset', 'q');
      f.append(el('legend', null, esc(q.q)));
      const why = el('p', 'why');
      why.hidden = true;
      const btns = q.opts.map((o, oi) => {
        const b = el('button', 'opt', esc(o));
        b.type = 'button';
        b.addEventListener('click', () => {
          if (state[qi]) return;
          if (oi === q.a) {
            state[qi] = true;
            b.classList.add('ok');
            btns.forEach((x) => { x.disabled = true; });
            why.hidden = false;
            why.textContent = 'Верно. ' + q.why;
            if (state.every(Boolean)) {
              markDone(l.id);
              result.hidden = false;
              result.innerHTML = '<div class="msg"><strong>Викторина пройдена.</strong>Все ответы верные.</div>';
              const next = LESSONS[indexOf(l.id) + 1];
              if (next) result.append(button('Следующий урок', 'btn-primary', () => go(next.id)));
            }
          } else {
            b.classList.add('bad');
            b.disabled = true;
            why.hidden = false;
            why.textContent = 'Не совсем. Попробуйте другой вариант.';
          }
        });
        return b;
      });
      f.append(...btns, why);
      wrap.append(f);
    });
    wrap.append(result);
    return wrap;
  }

  /* ───── Экраны ───── */
  const main = $('#main');
  const nav = $('#nav');
  const side = $('#side');
  const scrim = $('#scrim');

  function lessonLink(l, i) {
    return `<a href="#l-${l.id}" data-go="${l.id}"${currentId === l.id ? ' aria-current="page"' : ''}><span class="num">${done.has(l.id) ? '✓' : i + 1}</span><span>${esc(l.title)}</span></a>`;
  }
  function renderNav() {
    let html = '';
    MODULES.forEach((m) => {
      const items = LESSONS.map((l, i) => [l, i]).filter(([l]) => l.module === m.id);
      html += `<div class="nav-mod"><h2>${esc(m.title)}</h2><ul>` +
        items.map(([l, i]) => `<li class="${done.has(l.id) ? 'done' : ''}">${lessonLink(l, i)}</li>`).join('') + '</ul></div>';
    });
    nav.innerHTML = html;
  }
  function renderProgress() {
    const f = done.size / total;
    const label = `Пройдено ${done.size} из ${total}`;
    $('#sideMoon').innerHTML = moonSVG(f, 44, label);
    $('#topMoon').innerHTML = moonSVG(f, 30, label);
    $('#progText').textContent = label;
    $('#progBar').style.width = Math.round(f * 100) + '%';
  }
  function markDone(id) {
    if (done.has(id)) return;
    done.add(id);
    store.set('lc.done', JSON.stringify([...done]));
    renderNav();
    renderProgress();
  }

  function firstOpen() {
    const l = LESSONS.find((x) => !done.has(x.id));
    return l ? l.id : LESSONS[0].id;
  }

  function renderHome() {
    const view = el('div', 'view wide');
    const open = firstOpen();
    const started = done.size > 0;
    const hero = el('div', 'hero');
    const text = el('div', 'hero-text');
    const f = done.size / total;
    text.innerHTML =
      '<span class="eyebrow">Курс для начинающих</span>' +
      '<h1>Lua для Roblox с нуля</h1>' +
      `<p class="lead">${total} коротких уроков: от первой строки кода до собственной игровой механики. Код запускается прямо на этой странице, а задачи проверяются автоматически.</p>` +
      `<div class="hero-moon">${moonSVG(f, 72, `Пройдено ${done.size} из ${total}`)}<small>Луна растёт с каждым пройденным уроком: ${done.size} из ${total}.</small></div>`;
    const actions = el('div', 'actions');
    actions.append(
      button(started && done.size < total ? `Продолжить с урока ${indexOf(open) + 1}` : 'Начать с первого урока', 'btn-primary', () => go(done.size === total ? LESSONS[0].id : open))
    );
    text.append(actions);

    const demo = el('div', 'example');
    demo.append(el('span', 'eyebrow', 'Попробуйте прямо сейчас'));
    const demoCode = L`
      local players = {"Alex", "Mira", "Kai"}

      for i, name in ipairs(players) do
          print(i .. ". Привет, " .. name .. "!")
      end
    `;
    const out = newOut();
    const ed = createEditor(demoCode, { label: 'Пример кода, его можно менять', onRun: run });
    function run() {
      const res = LuaEngine.run(ed.get());
      renderOut(out, res);
      ed.markError(res.error && res.error.line ? res.error.line : null);
    }
    const da = el('div', 'actions');
    da.append(button(PLAY + ' Запустить', 'btn-primary', run), el('span', 'spacer'), el('span', 'kbd', 'Ctrl + Enter'));
    demo.append(ed.el, da, out);
    hero.append(text, demo);
    view.append(hero);

    view.append(el('h3', null, 'Программа'));
    const mods = el('div', 'mods');
    MODULES.forEach((m) => {
      const items = LESSONS.map((l, i) => [l, i]).filter(([l]) => l.module === m.id);
      const d = items.filter(([l]) => done.has(l.id)).length;
      const card = el('div', 'mod');
      card.innerHTML = `<h3>${esc(m.title)}</h3><span class="count">${d} из ${items.length}</span><ul>` +
        items.map(([l, i]) => `<li class="${done.has(l.id) ? 'done' : ''}"><a href="#l-${l.id}" data-go="${l.id}"><span>${i + 1}. ${esc(l.title)}</span></a></li>`).join('') + '</ul>';
      mods.append(card);
    });
    view.append(mods);

    view.append(el('h3', null, 'Как это устроено'));
    view.append(el('ul', 'facts',
      '<li>Lua 5.3 работает в вашем браузере, ничего устанавливать не нужно.</li>' +
      '<li>Для уроков про Roblox есть упрощённая эмуляция: объекты Instance, события, игроки. Мир она не рисует, но поведение кода повторяет.</li>' +
      '<li>Roblox использует Luau, потомка Lua. Различия коротко описаны в уроке про Studio.</li>' +
      '<li>Прогресс и ваш код сохраняются в этом браузере, если он разрешает хранить данные.</li>'
    ));
    return view;
  }

  function renderLesson(l) {
    const i = indexOf(l.id);
    const mod = MODULES.find((m) => m.id === l.module);
    const view = el('article', 'view');
    const head = el('header');
    head.style.display = 'flex';
    head.style.flexDirection = 'column';
    head.style.gap = '0.6rem';
    head.innerHTML = `<span class="eyebrow">${esc(mod.title)} · Урок ${i + 1} из ${total} · ${l.min} мин</span><h1 tabindex="-1" id="lessonTitle">${esc(l.title)}</h1><p class="lead">${esc(l.lead)}</p>`;
    view.append(head);
    const body = el('div', 'body');
    l.blocks.forEach((b) => body.append(renderBlock(b)));
    view.append(body);
    if (l.quiz) view.append(quizBlock(l));
    if (l.task) {
      const t = taskBlock(l);
      view.append(t);
      if (l.finale && done.has(l.id)) showFinale(t);
    }
    const pager = el('div', 'pager');
    const prev = LESSONS[i - 1];
    const next = LESSONS[i + 1];
    pager.append(
      prev ? button('← ' + prev.title, '', () => go(prev.id)) : button('← К программе', '', () => go('home')),
      next ? button(next.title + ' →', '', () => go(next.id)) : el('span')
    );
    view.append(pager);
    return view;
  }

  function go(id) {
    const l = byId(id);
    currentId = l ? id : 'home';
    main.innerHTML = '';
    main.append(l ? renderLesson(l) : renderHome());
    renderNav();
    closeNav();
    window.scrollTo(0, 0);
    const title = $('#lessonTitle');
    if (title) title.focus({ preventScroll: true });
    try { history.replaceState(null, '', currentId === 'home' ? '#' : '#l-' + currentId); } catch (e) { /* адрес менять нельзя */ }
    if (l) store.set('lc.last', id);
  }

  function openNav() {
    side.classList.add('open');
    scrim.hidden = false;
    $('#menuBtn').setAttribute('aria-expanded', 'true');
  }
  function closeNav() {
    side.classList.remove('open');
    scrim.hidden = true;
    $('#menuBtn').setAttribute('aria-expanded', 'false');
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-go]');
    if (a) {
      e.preventDefault();
      go(a.getAttribute('data-go'));
    }
  });
  $('#menuBtn').addEventListener('click', () => (side.classList.contains('open') ? closeNav() : openNav()));
  scrim.addEventListener('click', closeNav);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && side.classList.contains('open')) closeNav();
  });
  window.addEventListener('hashchange', () => {
    const m = /^#l-([\w-]+)$/.exec(location.hash);
    const id = m && byId(m[1]) ? m[1] : 'home';
    if (id !== currentId) go(id);
  });

  if (!LuaEngine.available) {
    const warn = el('div', 'alert', 'Интерпретатор Lua не загрузился. Проверьте подключение к интернету и обновите страницу: без него код запускать нельзя.');
    warn.setAttribute('role', 'alert');
    $('#alertSlot').append(warn);
  }
  renderProgress();
  const m0 = /^#l-([\w-]+)$/.exec(location.hash);
  go(m0 && byId(m0[1]) ? m0[1] : 'home');
})();

</script>
</body>
</html>
